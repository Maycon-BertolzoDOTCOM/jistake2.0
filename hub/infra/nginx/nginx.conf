# HUB Multi-Vertical — Nginx Configuration
# CDN transparente + Tarpit para scanners + Honeypot integration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format tarpit_format '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'tarpit_hit=$tarpit_hit';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/tarpit.log tarpit_format;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip (desligado no tarpit)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=cdn_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=tarpit_limit:10m rate=1r/s;

    # Scanner detection — expanded (pentest tools + LLM crawlers + empty UA)
    map $http_user_agent $is_scanner {
        default 0;

        # Ferramentas de automação / pentest
        "~*python-requests" 1;
        "~*aiohttp" 1;
        "~*httpx" 1;
        "~*curl/" 1;
        "~*wget/" 1;
        "~*zgrab" 1;
        "~*masscan" 1;
        "~*nmap" 1;
        "~*nikto" 1;
        "~*sqlmap" 1;

        # LLM crawlers (treinamento e scraping)
        "~*GPTBot" 1;
        "~*ChatGPT-User" 1;
        "~*OAI-SearchBot" 1;
        "~*ClaudeBot" 1;
        "~*Claude-Web" 1;
        "~*anthropic-ai" 1;
        "~*Google-Extended" 1;
        "~*CCBot" 1;
        "~*PerplexityBot" 1;
        "~*Diffbot" 1;
        "~*Bytespider" 1;

        # Genéricos
        "~*bot" 1;
        "~*crawler" 1;
        "~*spider" 1;
        "~*scanner" 1;

        # Requisição sem User-Agent
        "~*^$" 1;
    }

    # Tarpit flag
    map $is_scanner $tarpit_hit {
        default 0;
        1 1;
    }

    # Upstream para backend (app na VM)
    upstream hub_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Upstream para honeypot
    upstream honeypot_backend {
        server 127.0.0.1:5001;
        keepalive 16;
    }

    # Server principal (HTTPS via API Gateway TLS termination)
    server {
        listen 80;
        listen [::]:80;
        server_name hub.local;

        # Redirect HTTP to HTTPS (handled by API Gateway)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hub.local;

        # SSL handled by API Gateway, mas certs locais para health checks
        ssl_certificate /etc/nginx/ssl/hub.local.crt;
        ssl_certificate_key /etc/nginx/ssl/hub.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'";

        root /var/www/hub;
        index index.html;

        # Frontend estático (SPA)
        location / {
            limit_req zone=cdn_limit burst=20 nodelay;

            # Tarpit redirect para scanners
            if ($is_scanner) {
                rewrite ^ /loop-defense last;
            }

            try_files $uri $uri/ /index.html;

            # Cache para assets estáticos
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API Gateway proxy para backend
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://hub_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Tarpit endpoint — captura scanners
        location = /loop-defense {
            limit_req zone=tarpit_limit burst=1 nodelay;
            limit_rate 50;
            gzip off;
            brotli off;

            # Resposta lenta e inútil
            return 200 '<?xml version="1.0"?><root><data>';
            add_header Content-Type text/xml;
            add_header X-Tarpit "true";
            add_header X-Robots-Tag "noindex, nofollow";
        }

        # Honeypot endpoints (falsos caminhos atrativos)
        location ~ ^/(admin|wp-admin|phpmyadmin|.git|.env|config|backup|api/v1/users|api/v1/admin) {
            limit_req zone=tarpit_limit burst=1 nodelay;
            limit_rate 50;
            gzip off;
            brotli off;

            proxy_pass http://honeypot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            access_log /var/log/nginx/honeypot.log tarpit_format;
        }

        # Health check (sem rate limit, sem tarpit)
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Métricas Prometheus (se habilitado)
        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://hub_backend/metrics;
        }
    }

    # Server para honeypot direto (porta 5001, apenas localhost)
    server {
        listen 127.0.0.1:5001;
        server_name honeypot.local;

        location / {
            proxy_pass http://honeypot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}