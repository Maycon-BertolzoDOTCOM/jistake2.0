name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  PYTHONPATH: .

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install license checker
        run: pip install license-checker
      - name: Run license check
        run: python scripts/check_licenses.py

  janus-tests:
    name: Janus Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q pyyaml pytest pytest-asyncio httpx
      - name: Run Janus tests
        run: python -m pytest janus/tests/ -q

  hub-tests:
    name: HUB Tests (Trama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vector/trama
          path: trama
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd trama
          pip install -q fastapi pytest httpx pytest-asyncio
      - name: Run HUB tests
        run: |
          cd trama
          python -m pytest tests/test_hub.py -q

  janus-e2e:
    name: Janus E2E (stub mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q pyyaml pytest pytest-asyncio httpx
      - name: Run E2E smoke
        env:
          JANUS_STUB_MODE: recusa
        run: |
          cat > /tmp/janus_e2e.py <<'PYEOF'
          import asyncio, yaml
          from janus.queue.worker import processar_link
          from janus.queue.reporter import gerar
          from janus.queue.adapters import FileQueueAdapter

          reg = yaml.safe_load(open('janus/links/registry.yaml'))
          for g in reg['gpts']:
              if g['id'] == 'jis-take-2.0':
                  g['gate'] = 'pre-aprovado'
          cfg = FileQueueAdapter().config()
          item = {
              'link': 'https://chatgpt.com/g/g-69f50c32803c819182125318574cdc3d-jis-take-2-0-video-direction-by-dougdemarco',
              'runs': 1,
              'categorias': ['cat1_direta', 'cat8_output_embedding'],
          }
          r = asyncio.run(processar_link(item, reg, cfg))
          assert r['status'] == 'concluido', r
          assert r['taxa_falha'] == 0.0, r
          out = gerar('/tmp/janus-ci/fila-2026-10-12')
          print('E2E OK:', sorted(p.name for p in out.iterdir()))
          PYEOF
          python /tmp/janus_e2e.py

  hub-node:
    name: HUB Node (typecheck, test, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install workspace
        working-directory: hub
        run: npm ci
      # typecheck roda ANTES de build e com --force. A task `typecheck` do turbo
      # declara dependsOn: ["^build"], entao depende de artefatos de
      # dependencias ja compilados — nunca de um build local.
      - name: Typecheck (sem cache)
        working-directory: hub
        run: npm run typecheck -- --force
      # O guard de contrato do capacity-engine vive em contract.ts, fora de src/,
      # e e compilado por um tsconfig proprio. Rodar separado deixa visivel
      # qual falha ocorreu, em vez de um "typecheck failed" generico.
      - name: Contract guard (capacity-engine)
        working-directory: hub
        run: npx tsc --noEmit -p core/capacity-engine/tsconfig.contract.json
      - name: Test (sem cache)
        working-directory: hub
        run: npm run test -- --force
      - name: Lint
        working-directory: hub
        run: npm run lint
      - name: Build (sem cache)
        working-directory: hub
        run: npm run build -- --force
      - name: Guard - nenhum artefato de build vazou para a raiz dos pacotes
        working-directory: hub
        run: |
          leaked=$(find core plugins -maxdepth 2 \( -name '*.js' -o -name '*.d.ts' -o -name '*.js.map' -o -name '*.d.ts.map' \) \
            -not -path '*/node_modules/*' -not -path '*/dist/*' || true)
          if [ -n "$leaked" ]; then
            echo "Artefato de build encontrado na raiz de um pacote:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: nenhum artefato na raiz dos pacotes."

  hub-web-build:
    name: HUB Web Build (placeholder)
    runs-on: ubuntu-latest
    if: false  # habilitar quando hub-web existir
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build
        run: |
          cd hub-web
          npm ci
          npm run build

  notify:
    name: Notify
    needs: [license-check, janus-tests, hub-tests, hub-node, janus-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "CI completed"
          echo "License: ${{ needs.license-check.result }}"
          echo "Janus: ${{ needs.janus-tests.result }}"
          echo "HUB (trama): ${{ needs.hub-tests.result }}"
          echo "HUB (node): ${{ needs.hub-node.result }}"
          echo "E2E: ${{ needs.janus-e2e.result }}"